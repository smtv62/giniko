```yaml
name: Giniko Kanal Tarama

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: giniko-kanal-tarama
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Python dosyasını kontrol et
        run: |
          test -f nilo.py || {
            echo "HATA: nilo.py bulunamadı!"
            exit 1
          }

      - name: Kanalları tara
        run: |
          python -u nilo.py

      - name: M3U dosyasını doğrula
        run: |
          if [ ! -f channels5.m3u ]; then
            echo "HATA: channels5.m3u oluşturulmadı!"
            ls -la
            exit 1
          fi

          if ! head -n 1 channels5.m3u | grep -q '^#EXTM3U'; then
            echo "HATA: M3U başlığı geçersiz!"
            exit 1
          fi

          COUNT=$(grep -c '^#EXTINF:' channels5.m3u || true)

          echo "Bulunan kanal: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "HATA: Geçerli kanal bulunamadı!"
            exit 1
          fi

          echo "M3U doğrulaması başarılı."

      - name: Değişiklikleri kaydet ve gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels5.m3u

          if git diff --cached --quiet; then
            echo "M3U dosyasında değişiklik yok."
          else
            git commit -m "Kanal tarama: $(date -u +'%Y-%m-%d')"
            git push
          fi
```
