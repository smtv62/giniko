```yaml
name: Giniko Kanal Tarama

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılık Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kanalları Tara
        run: python nilo.py

      - name: M3U Dosyasını Kontrol Et
        run: |
          if [ ! -f channels5.m3u ]; then
            echo "HATA: channels5.m3u dosyası oluşturulmadı!"
            exit 1
          fi

          COUNT=$(grep -c '^#EXTINF:' channels5.m3u || true)

          echo "Bulunan kanal: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "HATA: Kanal sayısı sıfır veya dosya boş!"
            exit 1
          fi

          if ! head -n 1 channels5.m3u | grep -q '^#EXTM3U'; then
            echo "HATA: M3U başlığı geçersiz!"
            exit 1
          fi

      - name: Commit ve Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add channels5.m3u

          if git diff --staged --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Kanal tarama: $(date +'%Y-%m-%d')"
            git push
          fi
```
